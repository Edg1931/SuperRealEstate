name: Unity EditMode Tests

# Runs the ~41 EditMode tests (the pure engine logic) in CI via GameCI.
#
# GATED: this job only runs when the repo variable ENABLE_UNITY_CI == 'true', so
# the workflow stays green (skipped) until you opt in — Unity CI needs a license.
#
# To enable:
#   1. Settings → Secrets and variables → Actions → Variables:
#        add ENABLE_UNITY_CI = true
#   2. Activate a free Unity Personal license for CI (GameCI docs:
#      https://game.ci/docs/github/activation) and add the secrets:
#        UNITY_LICENSE   (contents of the .ulf file)
#        UNITY_EMAIL     UNITY_PASSWORD   (the Unity account)
#   Then push — results show in the Checks tab + an uploaded artifact.

on:
  push:
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/unity-tests.yml"
  pull_request:
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
  workflow_dispatch: {}

jobs:
  editmode-tests:
    name: EditMode tests
    runs-on: ubuntu-latest
    # Opt-in gate — set the ENABLE_UNITY_CI repo variable to 'true' to run.
    if: ${{ vars.ENABLE_UNITY_CI == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Cache the imported Library to speed up subsequent runs.
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-test-results
          path: test-results
